name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-release-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile harness
        run: python -m compileall -q scripts tests

      - name: Validate release package
        run: python scripts/validate.py --strict

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build boundary-case dry-run plan
        run: >-
          python scripts/run_ab_eval.py
          --case B07
          --case B08
          --case B09
          --output "${RUNNER_TEMP}/goal-to-proof-ab-plan"
          --dry-run
