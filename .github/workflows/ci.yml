name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-release-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile harness
        run: python -m compileall -q scripts tests

      - name: Validate release package
        run: python scripts/validate.py --strict

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build boundary-case dry-run plan
        run: >-
          python scripts/run_ab_eval.py
          --case B07
          --case B08
          --case B09
          --output "${RUNNER_TEMP}/goal-to-proof-ab-plan"
          --dry-run
